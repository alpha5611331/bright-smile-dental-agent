[project]
name = "bright-smile"
version = "0.1.0"
description = "Bright Smile Dental AI Front Desk: KB-grounded patient chat agent and lead API"
authors = [
    { name = "Kevin Kamto", email = "kevin.kamto.us@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]>=0.143.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.41",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RET", "PTH",
    "ASYNC", "S", "BLE", "FBT", "PT", "RUF", "TRY", "PERF", "FAST", "ANN",
]
ignore = [
    "TRY003", # long messages in exception constructors are fine for domain errors
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN201", "FBT001"]

[tool.ruff.lint.isort]
known-first-party = ["bright_smile"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not eval"]
markers = ["eval: live evaluations against the real Claude API (manual, needs ANTHROPIC_API_KEY)"]
filterwarnings = ["error"]
